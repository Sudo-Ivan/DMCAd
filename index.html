<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Searchable viewer for DMCA notices and delisting requests across GitHub, Google, Wikimedia, and LBRY. Unofficial." />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f7f5" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0c0c0e" />
    <title>DMCAd</title>
    <!-- Warm the cache for the small files the app fetches on startup so
         they download in parallel with the JS bundle instead of waiting
         for it. Mirrors the eager set in src/App.tsx: manifest, every
         stats file, the two small indexes, and the newest github index
         part (the rest of the split index streams in after first
         paint). crossorigin lets fetch() reuse them. The month in the
         github part name is the newest data month; bump it when the
         corpus rolls over. -->
    <link rel="preload" as="fetch" href="%BASE_URL%data/sources.json" crossorigin />
    <link rel="preload" as="fetch" href="%BASE_URL%data/stats/github.json" crossorigin />
    <link rel="preload" as="fetch" href="%BASE_URL%data/stats/google.json" crossorigin />
    <link rel="preload" as="fetch" href="%BASE_URL%data/stats/wikimedia.json" crossorigin />
    <link rel="preload" as="fetch" href="%BASE_URL%data/stats/lbry.json" crossorigin />
    <link rel="preload" as="fetch" href="%BASE_URL%data/src/wikimedia.json" crossorigin />
    <link rel="preload" as="fetch" href="%BASE_URL%data/src/lbry.json" crossorigin />
    <link rel="preload" as="fetch" href="%BASE_URL%data/src/github-2026-11.json" crossorigin />
    <script>
      ;(function () {
        try {
          var t = localStorage.getItem('theme')
          var d = t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.classList.toggle('dark', d)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
